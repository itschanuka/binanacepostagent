name: Post to Binance Square

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger poster
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -X POST "$APP_URL/api/cron/post-square" \
            -H "Authorization: Bearer $CRON_SECRET"
